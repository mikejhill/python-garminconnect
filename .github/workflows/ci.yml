name: CI

"on":
  push:
    branches:
      - main
      - master
      - revamp
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pdm
          pdm install --group :all

      - name: Lint with ruff
        run: |
          pdm run ruff check .

      - name: Format check with ruff
        run: |
          pdm run ruff format --check .

      - name: Type check with mypy
        run: |
          pdm run mypy garminconnect --ignore-missing-imports

      # Live-account integration tests remain outside credential-free CI.

      - name: Check for coverage report
        id: coverage_check
        run: |
          if [ -f coverage.xml ]; then
            echo "coverage_generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "coverage_generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage artifact
        if: matrix.python-version == '3.11' && steps.coverage_check.outputs.coverage_generated == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-xml
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] safety

      - name: Security check with bandit
        run: |
          bandit -r garminconnect -f json -o bandit-report.json || true

      - name: Safety check
        run: |
          safety check --json --output safety-report.json || true
        continue-on-error: true
